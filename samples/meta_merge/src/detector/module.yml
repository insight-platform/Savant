name: meta_merge_detector

parameters:
  output_frame:
    codec: ${oc.env:CODEC, 'copy'}
  batch_size: 1

  default_yolo_converter:
    module: savant.converter.yolo
    class_name: TensorToBBoxConverter
    kwargs:
      confidence_threshold: 0.25
      nms_iou_threshold: 0.45
      top_k: 300

  default_yolo_selector:
    module: savant.selector.detector
    class_name: MinMaxSizeBBoxSelector
    kwargs:
      min_width: 30
      min_height: 30

pipeline:
  source:
    element: zeromq_source_bin
    properties:
      socket: ${oc.env:ZMQ_SRC_ENDPOINT}
      source_id: ${oc.decode:${oc.env:SOURCE_ID, null}}
      source_id_prefix: ${oc.decode:${oc.env:SOURCE_ID_PREFIX, null}}
      source_timeout: ${oc.decode:${oc.env:SOURCE_TIMEOUT, 10}}
      source_eviction_interval: ${oc.decode:${oc.env:SOURCE_EVICTION_INTERVAL, 1}}
      blacklist_size: ${oc.decode:${oc.env:SOURCE_BLACKLIST_SIZE, 1024}}
      blacklist_ttl: ${oc.decode:${oc.env:SOURCE_BLACKLIST_TTL, 10}}
      ingress_queue_length: ${oc.decode:${oc.env:INGRESS_QUEUE_LENGTH, null}}
      ingress_queue_byte_size: ${oc.decode:${oc.env:INGRESS_QUEUE_BYTE_SIZE, null}}
      decoder_queue_length: ${oc.decode:${oc.env:DECODER_QUEUE_LENGTH, null}}
      decoder_queue_byte_size: ${oc.decode:${oc.env:DECODER_QUEUE_BYTE_SIZE, null}}
      eos_on_frame_resolution_change: ${oc.decode:${oc.env:EOS_ON_FRAME_RESOLUTION_CHANGE, null}}
      low_latency_decoding: ${oc.decode:${oc.env:LOW_LATENCY_DECODING, null}}
    ingress_frame_filter:
      module: samples.meta_merge.src.detector.roi_ingress_filter
      class_name: ROIIngressFilter
      kwargs:
        roi: ${oc.env:MODULE_ROI, 'left'}
  elements:
    - element: nvinfer@detector
      name: yolov11n
      model:
        remote:
          url: s3://savant-data/models/yolo11n/yolo11n.zip
          checksum_url: s3://savant-data/models/yolo11n/yolo11n.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com
        format: onnx
        model_file: yolo11n.onnx
        batch_size: ${parameters.batch_size}
        workspace_size: 6144
        input:
          object: router.${oc.env:MODULE_ROI, 'left'}_roi
          shape: [3, 640, 640]
          scale_factor: 0.0039215697906911373
          maintain_aspect_ratio: true
          symmetric_padding: true
        output:
          layer_names: [output0]
          num_detected_classes: 80
          converter: ${parameters.default_yolo_converter}
          objects:
            - class_id: 0
              label: person
              selector: ${parameters.default_yolo_selector}
            - class_id: 1
              label: bicycle
              selector: ${parameters.default_yolo_selector}
            - class_id: 2
              label: car
              selector: ${parameters.default_yolo_selector}
            - class_id: 3
              label: motorcycle
              selector: ${parameters.default_yolo_selector}
            - class_id: 5
              label: bus
              selector: ${parameters.default_yolo_selector}
            - class_id: 7
              label: truck
              selector: ${parameters.default_yolo_selector}
