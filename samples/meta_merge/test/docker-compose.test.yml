services:
  source:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: runc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ./:/app:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - ZMQ_SOCKET=dealer+connect:ipc:///tmp/zmq-sockets/infer.ipc
      - ZMQ_SEND_TIMEOUT_MS=10000
      - ZMQ_RECEIVE_TIMEOUT_MS=5000
      - ZMQ_SEND_RETRIES=10
      - ZMQ_RECEIVE_RETRIES=10
      - REPETITIONS=10
      - FRAME_INTERVAL_MS=1000
      - IMAGE_PATH=/app/test_image.jpeg
    command: python source.py
    depends_on:
      infer:
        condition: service_started

  infer:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: runc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ./:/app:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - ZMQ_INGRESS=router+bind:ipc:///tmp/zmq-sockets/infer.ipc
      - ZMQ_EGRESS=dealer+bind:ipc:///tmp/zmq-sockets/sink.ipc
      - ZMQ_SEND_TIMEOUT_MS=10000
      - ZMQ_RECEIVE_TIMEOUT_MS=5000
      - ZMQ_SEND_RETRIES=10
      - ZMQ_RECEIVE_RETRIES=10
    command: python infer.py

  sink:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: runc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ./:/app:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - ZMQ_SOCKET=router+connect:ipc:///tmp/zmq-sockets/sink.ipc
      - ZMQ_RECEIVE_TIMEOUT_MS=5000
    command: python sink.py
    depends_on:
      infer:
        condition: service_started

volumes:
  zmq_sockets:
