# module name, required
name: ${oc.env:MODULE_NAME, 'pygroup-demo'}

# base module parameters
parameters:
  frame:
    width: 1920
    height: 1080
  batch_size: 1
  output_frame:
    codec: ${oc.env:CODEC, 'h264'}

  # Auxiliary streams produced by the colocated pyfuncs.
  auxiliary_encoders:
    - ${pipeline.elements[0].elements[0].kwargs.codec_params}
    - ${pipeline.elements[0].elements[1].kwargs.codec_params}

  # Telemetry configuration. With pygroup, each colocated pyfunc is
  # wrapped in its own telemetry span so you can profile them
  # individually in Jaeger / OTLP backends.
  telemetry:
    tracing:
      sampling_period: ${oc.decode:${oc.env:TRACING_SAMPLING_PERIOD, 100}}
      append_frame_meta_to_span: ${oc.decode:${oc.env:TRACING_APPEND_FRAME_META_TO_SPAN, True}}
      root_span_name: ${oc.decode:${oc.env:TRACING_ROOT_SPAN_NAME, 'pygroup-demo'}}
      provider: ${oc.decode:${oc.env:TRACING_PROVIDER, null}}

# pipeline definition
pipeline:
  elements:
    # Two pyfuncs colocated in a single GStreamer element.
    # They run sequentially on every buffer and each gets its own
    # telemetry span named "<module>.<class_name>".
    - element: pygroup
      name: overlays_group
      elements:
        - module: samples.pygroup.overlays
          class_name: HorizontalLineOverlay
          kwargs:
            aux_suffix: '-h'
            aux_width: 640
            aux_height: 360
            codec_params:
              codec: ${oc.env:CODEC, 'h264'}
            line_color_rgba: [0, 255, 0, 255]

        - module: samples.pygroup.overlays
          class_name: VerticalLineOverlay
          kwargs:
            aux_suffix: '-v'
            aux_width: 854
            aux_height: 480
            codec_params:
              codec: ${oc.env:CODEC, 'h264'}
            line_color_rgba: [255, 0, 0, 255]
