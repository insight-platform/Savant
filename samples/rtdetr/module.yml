name: rtdetr_r50_demo

parameters:
  frame:
    width: 1920
    height: 1080
  output_frame:
    codec: ${oc.env:CODEC, 'h264'}
  draw_func: {}
  batch_size: 1

  model_name: rtdetr_r50_savant
  model_ver: 0d0a4f5

  model: ${parameters.model_name}_${parameters.model_ver}

pipeline:

  elements:
    - element: nvinfer@detector
      name: ${parameters.model_name}
      model:
        remote:
          url: s3://savant-data/models/${parameters.model}/${parameters.model}.zip
          checksum_url: s3://savant-data/models/${parameters.model}/${parameters.model}.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com
        format: onnx

        workspace_size: 6144
        model_file: ${parameters.model_name}.onnx
        label_file: labels.txt

        input:
          shape: [3, 640, 640]
          scale_factor: 0.0039215697906911373
          maintain_aspect_ratio: False

        output:
          layer_names: [output]
          # load-bearing: the converter dispatches on shape[0] == num_detected_classes + 4
          num_detected_classes: 80
          converter:
            module: savant.converter.yolo
            class_name: TensorToBBoxConverter
            kwargs:
              confidence_threshold: 0.25
              # RT-DETR uses one-to-one matching, no clustering is needed,
              # same as cluster-mode=4 in the DeepStream-Yolo reference config
              nms_iou_threshold: 0.0
              top_k: 300
