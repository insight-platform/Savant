services:

  receiver:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
    environment:
      - ZMQ_ENDPOINT=pub+connect:ipc:///tmp/zmq-sockets/input-video.ipc
      - FFMPEG_LOGLEVEL=debug
      - FFMPEG_PARAMS=rtsp_transport=tcp
      - SYNC_OUTPUT=True
      - URI
      - SOURCE_ID=test
      - EOS_ON_START=True
    entrypoint: /opt/savant/adapters/gst/sources/ffmpeg.sh

  broadcaster:
    image: ghcr.io/insight-platform/savant-adapters-deepstream:latest
    restart: unless-stopped
    ports:
      - "6666:6666"
      - "888:888" # HLS
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../assets/stub_imgs:/stub_imgs
    environment:
      - ZMQ_ENDPOINT=sub+bind:ipc:///tmp/zmq-sockets/input-video.ipc
      - SOURCE_ID=test
      - STUB_FILE_LOCATION=/stub_imgs/smpte100_1920x1080.jpeg
      - DEV_MODE=True
    command: python -m adapters.ds.sinks.always_on_rtsp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  zmq_sockets:


