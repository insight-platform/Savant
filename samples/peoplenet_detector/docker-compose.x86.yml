  video-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:latest
    restart: "no"
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - /tmp/video-loop-source-downloads:/tmp/video-loop-source-downloads
      - ./assets/avg.mp4:/tmp/video-loop-source-downloads/avg.mp4
    environment:
      - LOCATION=/tmp/video-loop-source-downloads/avg.mp4
      - DOWNLOAD_PATH=/tmp/video-loop-source-downloads
      - FILE_TYPE=video
      - SOURCE_ID_BASE=city-traffic
      - ZMQ_ENDPOINT=pub+connect:ipc:///tmp/zmq-sockets/input-video.ipc
      - SYNC_OUTPUT=True
    entrypoint: >
      sh -c '
        echo "--- Starting video source loop (20 iterations) ---"
        BASE_SOURCE_ID="${SOURCE_ID_BASE:-city-traffic}"
        export FILE_TYPE="${FILE_TYPE:-video}"

        for i in $$(seq 1 20); do
          export SOURCE_ID="$${BASE_SOURCE_ID}-$${i}"
          echo "--- Running source adapter: iteration $${i}, SOURCE_ID=$${SOURCE_ID} ---"
          /opt/savant/adapters/gst/sources/media_files.sh
          EXIT_CODE=$$?
          if [ $$EXIT_CODE -ne 0 ]; then
            echo "--- Script failed with exit code $$EXIT_CODE on iteration $${i}. Stopping loop. ---"
            exit $$EXIT_CODE
          fi
          echo "--- Finished iteration $${i} ---"
        done
        echo "--- Video source loop finished (20 iterations) ---"
      '
    depends_on:
      module:
        condition: service_healthy


  module:
    image: ghcr.io/insight-platform/savant-deepstream:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../../cache:/cache
      - ..:/opt/savant/samples
    command: samples/peoplenet_detector/module.yml
    environment:
      - SHUTDOWN_AUTH=shutdown
      - MODEL_PATH=/cache/models/peoplenet_detector
      - DOWNLOAD_PATH=/cache/downloads/peoplenet_detector
      - ZMQ_SRC_ENDPOINT=sub+bind:ipc:///tmp/zmq-sockets/input-video.ipc
      - ZMQ_SINK_ENDPOINT=pub+bind:ipc:///tmp/zmq-sockets/output-video.ipc
      - METRICS_FRAME_PERIOD=1000

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    image: ghcr.io/insight-platform/savant-adapters-deepstream:latest
    restart: unless-stopped
    ports:
      - "554:554"    # RTSP
      - "1935:1935"  # RTMP
      - "888:888"    # HLS
      - "8889:8889"  # WebRTC
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../assets/stub_imgs:/stub_imgs
    environment:
      - ZMQ_ENDPOINT=sub+connect:ipc:///tmp/zmq-sockets/output-video.ipc
      - SOURCE_ID=city-traffic
      - FRAMERATE=25/1
      - SYNC_INPUT=True
      - STUB_FILE_LOCATION=/stub_imgs/smpte100_1280x900.jpeg
      - DEV_MODE=True
    command: python -m adapters.ds.sinks.always_on_rtsp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  zmq_sockets:
