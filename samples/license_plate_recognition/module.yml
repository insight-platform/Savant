name: license_plate_recognition

parameters:
  output_frame:
    codec: ${oc.env:CODEC, 'h264'}
    h264_encoder_params:
      profile: Baseline
      bitrate: 8000000
    hevc_encoder_params:
      profile: Main
      bitrate: 8000000
    jpeg_encoder_params:
      quality: 99
  frame:
    width: ${oc.decode:${oc.env:FRAME_WIDTH, 1920}}
    height: ${oc.decode:${oc.env:FRAME_HEIGHT, 1080}}
  draw_func:
    module: samples.license_plate_recognition.overlay
    class_name: Overlay
    rendered_objects:
      # each vehicle type is rendered with its own color;
      # the proxy "vehicle" object is not listed here, hence it is not rendered
      detector:
        car:
          bbox:
            border_color: '00FF00FF'  # Green
            background_color: '00000000'  # transparent
            thickness: 4
        motorcycle:
          bbox:
            border_color: 'FFFF00FF'  # Yellow
            background_color: '00000000'  # transparent
            thickness: 4
        bus:
          bbox:
            border_color: 'FF00FFFF'  # Magenta
            background_color: '00000000'  # transparent
            thickness: 4
        truck:
          bbox:
            border_color: 'FF8000FF'  # Orange
            background_color: '00000000'  # transparent
            thickness: 4
      lpd:
        lpd:
          bbox:
            border_color: '0000FFFF'  # Blue
            thickness: 4
          label:
            font_color: 'FFFFFFFF'  # White
            font_scale: 1.5
            thickness: 2

  # COCO vehicle types predicted by the detector; each type keeps its own label,
  # so that downstream units are able to distinguish between them
  vehicle_labels: [car, motorcycle, bus, truck]

  # proxy object created for every detected vehicle, see create_vehicle_roi.py
  vehicle_roi:
    element_name: create_vehicle_roi
    label: vehicle

  default_yolo_converter:
    module: savant.converter.yolo
    class_name: TensorToBBoxConverter
    kwargs:
      confidence_threshold: 0.25
      nms_iou_threshold: 0.45
      top_k: 300

  default_yolo_selector:
    module: savant.selector.detector
    class_name: MinMaxSizeBBoxSelector
    kwargs:
      min_width: 30
      min_height: 30

  batch_size: 1

pipeline:
  elements:
    - element: nvinfer@detector
      name: detector
      model:
        remote:
          url: s3://savant-data/models/yolov11s/yolov11s.zip
          checksum_url: s3://savant-data/models/yolov11s/yolov11s.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com              
        format: onnx
        model_file: yolov11s.onnx
        batch_size: ${parameters.batch_size}
        input:
          shape: [3, 640, 640]
          scale_factor: 0.0039215697906911373
          maintain_aspect_ratio: true
          symmetric_padding: true
        output:
          layer_names: [output0]
          num_detected_classes: 80  # required for YOLOv11
          converter: ${parameters.default_yolo_converter}
          # every COCO vehicle type gets its own label, see parameters.vehicle_labels
          objects:
            - class_id: 2
              label: car
              selector: ${parameters.default_yolo_selector}
            - class_id: 3
              label: motorcycle
              selector: ${parameters.default_yolo_selector}
            - class_id: 5
              label: bus
              selector: ${parameters.default_yolo_selector}
            - class_id: 7
              label: truck
              selector: ${parameters.default_yolo_selector}

    # tracker;
    # it is placed before the proxy ROI unit so that the tracker only receives
    # the vehicles themselves: a proxy occupies the same area as its parent and
    # would be discarded (or discard the parent) by the new target policy
    # of the tracker (see minIouDiff4NewTarget in the tracker config)
    - element: nvtracker
      properties:
        ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
        ll-config-file: ${oc.env:PROJECT_PATH}/samples/assets/tracker/config_tracker_NvDCF_perf.yml
        tracker-width: 640
        tracker-height: 384
        display-tracking-id: 0

    # add a proxy "vehicle" child object to each detected vehicle;
    # it is used as the input object for the LPD model
    - element: pyfunc
      module: samples.license_plate_recognition.create_vehicle_roi
      class_name: CreateVehicleROI

    # LPD https://catalog.ngc.nvidia.com/orgs/nvidia/teams/tao/models/lpdnet
    - element: nvinfer@detector
      name: lpd
      model:
        remote:
          url: s3://savant-data/models/lpdnet/lpdnet_pruned_v2.3.1.zip
          checksum_url: s3://savant-data/models/lpdnet/lpdnet_pruned_v2.3.1.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com
        model_file: LPDNet_usa_pruned_tao5.onnx
        batch_size: 16
        input:
          object: ${parameters.vehicle_roi.element_name}.${parameters.vehicle_roi.label}
          layer_name: input_1:0
          shape: [3, 480, 640]
          scale_factor: 0.0039215697906911373
        output:
          num_detected_classes: 1
          layer_names: [output_cov/Sigmoid:0, output_bbox/BiasAdd:0]
          objects:
            - class_id: 0
              label: lpd
              selector:
                kwargs:
                  confidence_threshold: 0.1
                  nms_iou_threshold: 0.5
                  min_width: 24
                  min_height: 16

    # # LPR https://catalog.ngc.nvidia.com/orgs/nvidia/teams/tao/models/lprnet
    # - element: nvinfer@classifier
    #   name: lpr
    #   model:
    #     remote:
    #       url: s3://savant-data/models/lprnet/lprnet_deployable_onnx_v1.1.zip
    #       checksum_url: s3://savant-data/models/lprnet/lprnet_deployable_onnx_v1.1.md5
    #       parameters:
    #         endpoint: https://eu-central-1.linodeobjects.com
    #     model_file: us_lprnet_baseline18_deployable.onnx
    #     batch_size: 16
    #     input:
    #       object: lpd.lpd
    #       layer_name: image_input
    #       shape: [3, 48, 96]
    #       scale_factor: 0.00392156862745098
    #     output:
    #       layer_names: [tf_op_layer_ArgMax, tf_op_layer_Max]
    #       converter:
    #         module: samples.license_plate_recognition.lprnet_converter
    #         class_name: LPRNetOutputConverter
    #       attributes:
    #         - name: lpr
    #           threshold: 0.1

    # OCR
    - element: nvinfer@attribute_model
      name: lpr
      model:
        remote:
          url: s3://savant-data/models/nvidia_ocrnet/ocrnet-vit.zip
          checksum_url: s3://savant-data/models/nvidia_ocrnet/ocrnet-vit.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com
        format: onnx
        model_file: ocrnet-vit.onnx
        batch_size: 16
        input:
          object: lpd.lpd
          shape: [1, 64, 200]
          color_format: gray
          scale_factor: 0.00784313
          offsets: [127.5]
        output:
          layer_names: [output_id, output_prob]
          converter:
            module: samples.license_plate_recognition.ocrnet_converter
            class_name: OCRNetVITOutputConverter
            kwargs:
              confidence_threshold: 0.1
          attributes:
            - name: lpr
