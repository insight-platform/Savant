services:
  module:
    privileged: true
    build:
      context: .
      dockerfile: docker/Dockerfile.x86
    extends:
      file: docker-compose-no-adapters.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=h264
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  graphite:
    extends:
      file: docker-compose-no-adapters.l4t.yml
      service: graphite

  grafana:
    extends:
      file: docker-compose-no-adapters.l4t.yml
      service: grafana

volumes:
  grafana_data:
