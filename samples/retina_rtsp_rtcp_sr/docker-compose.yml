services:

  mediamtx-src:
    build:
      context: .
      dockerfile: src/Dockerfile.mediamtx
    restart: unless-stopped
    volumes:
      - ../../data/clouds.mp4:/data/clouds.mp4
      - ./src/mediamtx.yml:/opt/mediamtx/mediamtx.yml

  mediamtx-re:
    build:
      context: .
      dockerfile: src/Dockerfile.mediamtx
    restart: unless-stopped
    volumes:
      - ./src/mediamtx_re.yml:/opt/mediamtx/mediamtx.yml
    depends_on:
      mediamtx-src:
        condition: service_started

  sync-rtsp-adapter:
    image: ghcr.io/insight-platform/savant-retina-rtsp-x86:v0.5.18
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - ZMQ_ENDPOINT=pub+connect:ipc:///tmp/zmq-sockets/input-video.ipc
      - RTSP_MAIN_URI=rtsp://mediamtx-re:554/main
      - RTSP_OVERLAY_URI=rtsp://mediamtx-re:554/overlay
    volumes:
      - ./src/rtsp_configuration.json:/opt/etc/configuration.json
      - zmq_sockets:/tmp/zmq-sockets
    depends_on:
      mediamtx-re:
        condition: service_started
      stitching:
        condition: service_healthy

  stitching:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:0.5.18-7.0
    restart: unless-stopped
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ./src:/opt/savant/stitching
    command: stitching/module.yml
    environment:
      - ZMQ_SRC_ENDPOINT=sub+bind:ipc:///tmp/zmq-sockets/input-video.ipc
      - ZMQ_SINK_ENDPOINT=dealer+bind:ipc:///tmp/zmq-sockets/output-video.ipc
      - METRICS_FRAME_PERIOD=10000
      - METRICS_TIME_PERIOD=60
      - DECODER_QUEUE_LENGTH=10
      - COMBINE_FRAMES_QUEUE_SIZE=60
      - WIDTH=1280
      - HEIGHT=720
      - BITRATE=16000000 # 64  Mbit/s
      - MAXBITRATE=16000000 # 64  Mbit/s
      - EGRESS_QUEUE_LENGTH=10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    privileged: true
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.5.18-7.0
    restart: unless-stopped
    ports:
      - "888:888" # HLS
      - "554:554" # RTSP
    volumes:
      - zmq_sockets:/tmp/zmq-sockets
      - ../assets/stub_imgs:/stub_imgs
    environment:
      - ZMQ_ENDPOINT=router+connect:ipc:///tmp/zmq-sockets/output-video.ipc
      - SOURCE_ID=composition
      - FRAMERATE=30/1
      - STUB_FILE_LOCATION=/stub_imgs/smpte100_1280x720.jpeg
      - DEV_MODE=True
    command: python -m adapters.ds.sinks.always_on_rtsp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    depends_on:
      sync-rtsp-adapter:
        condition: service_started

volumes:
  zmq_sockets:
