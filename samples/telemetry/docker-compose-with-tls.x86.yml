services:

  video-loop-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.5.11
    extends:
      file: docker-compose-with-tls.l4t.yml
      service: video-loop-source

  module:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:0.5.11-7.0
    extends:
      file: docker-compose-with-tls.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=h264
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    privileged: true
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.5.11-7.0
    extends:
      file: docker-compose-with-tls.l4t.yml
      service: always-on-sink
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # All-in-One Jaeger
  # https://www.jaegertracing.io/docs/1.62/getting-started/#all-in-one
  jaeger:
    extends:
      file: docker-compose-with-tls.l4t.yml
      service: jaeger

volumes:
  zmq_sockets:
