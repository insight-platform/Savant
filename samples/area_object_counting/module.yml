name: area-object-counting

parameters:
  sidebar_width: 296
  frame:
    width: 1280
    height: 720
    padding:
      keep: true
      left: 0
      right: ${parameters.sidebar_width}
      top: 0
      bottom: 0
    geometry_base: 4
  output_frame:
    codec: ${oc.env:CODEC, 'h264'}
  draw_func:
    module: samples.area_object_counting.overlay
    class_name: Overlay
    kwargs:
      config_path: ${oc.env:PROJECT_PATH}/samples/area_object_counting/area_config.yml
      sidebar_width: ${parameters.sidebar_width}
      target_obj_label: ${parameters.detected_object.label}

  detected_object:
    id: 0
    label: person

  default_yolo_converter:
    module: savant.converter.yolo
    class_name: TensorToBBoxConverter
    kwargs:
      confidence_threshold: 0.25
      nms_iou_threshold: 0.45
      top_k: 300

  default_yolo_selector:
    module: savant.selector.detector
    class_name: MinMaxSizeBBoxSelector
    kwargs:
      min_width: 30
      min_height: 30

  batch_size: 1

pipeline:
  elements:

    - element: pyfunc
      module: samples.area_object_counting.object_counting
      class_name: ConditionalDetectorSkip
      kwargs:
        config_path: ${oc.env:PROJECT_PATH}/samples/area_object_counting/area_config.yml

    - element: nvinfer@detector
      name: yolov11n
      model:
        remote:
          url: s3://savant-data/models/yolo11n/yolo11n.zip
          checksum_url: s3://savant-data/models/yolo11n/yolo11n.md5
          parameters:
            endpoint: https://eu-central-1.linodeobjects.com              
        format: onnx
        model_file: yolo11n.onnx
        batch_size: ${parameters.batch_size}
        workspace_size: 6144
        input:
          shape: [3, 640, 640]
          scale_factor: 0.0039215697906911373
          maintain_aspect_ratio: true
          symmetric_padding: true
        output:
          layer_names: [output0]
          num_detected_classes: 80  # required for YOLOv11
          converter: ${parameters.default_yolo_converter}
          objects:
            - class_id: ${parameters.detected_object.id}
              label: ${parameters.detected_object.label}
              selector: ${parameters.default_yolo_selector}

    - element: pyfunc
      module: samples.area_object_counting.object_counting
      class_name: ObjectCounting
      kwargs:
        config_path: ${oc.env:PROJECT_PATH}/samples/area_object_counting/area_config.yml
        target_obj_label: ${parameters.detected_object.label}
