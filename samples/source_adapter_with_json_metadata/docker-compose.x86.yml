services:

  image-json-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:latest
    extends:
      file: docker-compose.l4t.yml
      service: image-json-source

  module:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:latest
    extends:
      file: docker-compose.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=jpeg
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  image-json-sink:
    image: ghcr.io/insight-platform/savant-adapters-py:latest
    extends:
      file: docker-compose.l4t.yml
      service: image-json-sink

volumes:
  zmq_sockets:
