services:

  video-loop-city-traffic:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.5.14
    extends:
      file: docker-compose.l4t.yml
      service: video-loop-city-traffic

  video-loop-town-centre:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.5.14
    extends:
      file: docker-compose.l4t.yml
      service: video-loop-town-centre

  module:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:0.5.14-7.0
    extends:
      file: docker-compose.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=h264
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    privileged: true
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.5.14-7.0
    extends:
      file: docker-compose.l4t.yml
      service: always-on-sink
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  zmq_sockets:
