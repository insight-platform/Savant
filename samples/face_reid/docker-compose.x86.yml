services:

  index-builder-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.x86
    extends:
      file: docker-compose.l4t.yml
      service: index-builder-client

  index-builder-pipeline:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:0.5.12-7.0
    extends:
      file: docker-compose.l4t.yml
      service: index-builder-pipeline
    runtime: runc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  video-loop-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.5.12
    extends:
      file: docker-compose.l4t.yml
      service: video-loop-source

  module:
    privileged: true
    build:
      context: .
      dockerfile: docker/Dockerfile.x86
    extends:
      file: docker-compose.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=h264
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    privileged: true
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.5.12-7.0
    extends:
      file: docker-compose.l4t.yml
      service: always-on-sink
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  zmq_sockets:
