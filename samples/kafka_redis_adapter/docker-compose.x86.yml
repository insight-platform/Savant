services:
  kafka:
    extends:
      file: docker-compose.l4t.yml
      service: kafka

  keydb:
    image: eqalpha/keydb:x86_64_v6.3.3
    extends:
      file: docker-compose.l4t.yml
      service: keydb

  video-loop-source:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer:0.5.14
    extends:
      file: docker-compose.l4t.yml
      service: video-loop-source

  kafka-redis-sink:
    image: ghcr.io/insight-platform/savant-adapters-py:0.5.14
    extends:
      file: docker-compose.l4t.yml
      service: kafka-redis-sink

  kafka-redis-source:
    image: ghcr.io/insight-platform/savant-adapters-py:0.5.14
    extends:
      file: docker-compose.l4t.yml
      service: kafka-redis-source

  module:
    privileged: true
    image: ghcr.io/insight-platform/savant-deepstream:0.5.14-7.0
    extends:
      file: docker-compose.l4t.yml
      service: module
    runtime: runc
    environment:
      - CODEC=h264
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  always-on-sink:
    privileged: true
    image: ghcr.io/insight-platform/savant-adapters-deepstream:0.5.14-7.0
    extends:
      file: docker-compose.l4t.yml
      service: always-on-sink
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  kafka_data:
  zmq_sockets:
