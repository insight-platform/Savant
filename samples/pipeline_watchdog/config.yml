watch:
  - buffer: buffer:8000
    queue:
      action: stop
      length: 999
      cooldown: 60s
      polling_interval: 10s
      container:
        - labels: [queue-client-label1, queue-client-label2=2]
    egress:
      action: restart
      cooldown: 60s
      idle: 100s
      container:
        - labels: egress-client-label=egress-client-value
        - labels: some-label
      # Optional: filter metric samples by label key=value pairs.
      # When set, only samples matching all specified labels are used.
      # When omitted, max() across all samples is used (default).
      # label_filters:
      #   last_sent_message:
      #     reason: send_success
    ingress:
      action: restart
      cooldown: 30s
      idle: 60s
      container:
        - labels: ingress-client-label=3
